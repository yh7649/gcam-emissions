[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "gcam-emissions"
version = "0.1.0"
description = "GCAM scenario activity to speciated, spatially allocated air-pollutant emissions"
authors = [
  { name = "Yehyun Hong" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
requires-python = ">=3.11"
dependencies = [
    "pandas==3.0.3",
    "numpy==2.4.6",
    "pyarrow==24.0.0",
    "pdfplumber==0.11.8",
    "pypdf==6.14.2",
    "requests==2.34.2",
    "openpyxl==3.1.5",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "ruff==0.14.4",
]

[tool.flit.module]
name = "gcam_emissions"

[tool.flit.sdist]
include = ["src/gcam_emissions/reference/*.csv"]

[tool.ruff]
line-length = 99
src = ["src"]
include = ["pyproject.toml", "src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["gcam_emissions"]
force-sort-within-sections = true

[tool.pytest.ini_options]
testpaths = ["tests"]
